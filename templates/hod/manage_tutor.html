<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Manage Tutors</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

<link rel="stylesheet"
href="{{ url_for('static', filename='css/hod.css') }}">

</head>

<body>

<div class="container-fluid mt-4">

<div class="card shadow-lg border-0">

<div class="card-header bg-success text-white">

<h3>
<i class="bi bi-person-workspace"></i>
Manage Tutors
</h3>

</div>

<div class="card-body">

<form action="/add_tutor" method="POST">

<div class="row">

<div class="col-md-6 mb-3">
<label class="form-label">Tutor Name</label>

<input
type="text"
name="tutor_name"
class="form-control"
required>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">Department</label>

<input
type="text"
name="department"
class="form-control"
value="{{ department }}"
readonly>

</div>

<!-- Class Year -->

<div class="col-md-6 mb-3">

<label class="form-label">
Class Year
</label>

<select
name="class_year"
class="form-select"
required>

<option value="">Select Year</option>
<option value="I">I Year</option>
<option value="II">II Year</option>
<option value="III">III Year</option>
<option value="IV">IV Year</option>

</select>

</div>

<!-- Section -->

<div class="col-md-6 mb-3">

<label class="form-label">
Section
</label>

<select
name="section"
class="form-select"
required>

<option value="">Select Section</option>
<option value="A">A</option>
<option value="B">B</option>
<option value="C">C</option>
<option value="None">None</option>

</select>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">
Email
</label>

<input
type="email"
name="email"
class="form-control"
required>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">
Username
</label>

<input
type="text"
name="username"
class="form-control"
required>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">
Password
</label>

<input
type="password"
name="password"
class="form-control"
required>

</div>

</div>

<div class="text-center mt-4">

<button
type="submit"
class="btn btn-success btn-lg">

<i class="bi bi-plus-circle-fill"></i>

Create Tutor

</button>

<a
href="/hod"
class="btn btn-secondary btn-lg ms-2">

<i class="bi bi-arrow-left-circle-fill"></i>

Back

</a>

</div>

</form>

<hr class="my-4">

<h4>

<i class="bi bi-list-ul"></i>

Tutor List

</h4>

<div class="table-responsive">

<table class="table table-bordered table-hover align-middle">

<thead class="table-success">

<tr>

<th>ID</th>
<th>Tutor Name</th>
<th>Department</th>
<th>Class Year</th>
<th>Section</th>
<th>Email</th>
<th>Username</th>
<th>Edit</th>
<th>Delete</th>

</tr>

</thead>

<tbody>

{% for tutor in tutors %}

<tr>

<td>{{ tutor[0] }}</td>

<td>{{ tutor[1] }}</td>

<td>{{ tutor[2] }}</td>

<td>{{ tutor[3] }}</td>

<td>{{ tutor[4] }}</td>

<td>{{ tutor[5] }}</td>

<td>{{ tutor[6] }}</td>

<td>
<a href="{{ url_for('edit_tutor', tutor_id=tutor[0]) }}"
class="btn btn-warning btn-sm">

<i class="bi bi-pencil-square"></i>

Edit

</a>
</td>

<td>

<a href="{{ url_for('delete_tutor', tutor_id=tutor[0]) }}"
class="btn btn-danger btn-sm"
onclick="return confirm('Are you sure you want to delete this tutor?')">

<i class="bi bi-trash-fill"></i>

Delete

</a>

</td>

</tr>

{% endfor %}

</tbody>

</table>

</div>

</div>

</div>

</div>

</body>

</html>
