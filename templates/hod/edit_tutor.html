<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Tutor</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
          rel="stylesheet">

    <style>

        /* ======================================
           PAGE
        ====================================== */

        body {
            background: #eef3f7;
            font-family: 'Poppins', sans-serif;
        }


        /* ======================================
           MAIN CARD
        ====================================== */

        .card {
            border: none;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, .10);
            overflow: hidden;
        }


        /* ======================================
           CARD HEADER
        ====================================== */

        .card-header {
            background: #198754;
            color: white;
            font-size: 28px;
            font-weight: bold;
            border-radius: 18px 18px 0 0 !important;
            padding: 18px 24px;
        }

        .card-header i {
            margin-right: 8px;
        }


        /* ======================================
           LABEL
        ====================================== */

        .form-label {
            font-weight: 600;
            margin-bottom: 7px;
        }


        /* ======================================
           INPUT + SELECT
        ====================================== */

        .form-control,
        .form-select {
            height: 48px;
            border-radius: 10px;
            border: 1px solid #ced4da;
        }

        .form-control:focus,
        .form-select:focus {
            border-color: #198754;
            box-shadow: 0 0 0 0.2rem rgba(25, 135, 84, .15);
        }


        /* ======================================
           BUTTONS
        ====================================== */

        .btn-success {
            border-radius: 30px;
            padding: 10px 30px;
            font-weight: 600;
        }

        .btn-secondary {
            border-radius: 30px;
            padding: 10px 30px;
            font-weight: 600;
        }

        .btn i {
            margin-right: 5px;
        }


        /* ======================================
           RESPONSIVE
        ====================================== */

        @media (max-width: 576px) {

            .container {
                margin-top: 25px !important;
            }

            .card-header {
                font-size: 21px;
                padding: 15px 18px;
            }

            .card-body {
                padding: 20px !important;
            }

            .btn-success,
            .btn-secondary {
                padding: 9px 20px;
                font-size: 14px;
            }

        }

    </style>

</head>


<body>


<!-- ======================================
     MAIN CONTAINER
====================================== -->

<div class="container mt-5 mb-5">

    <div class="card">


        <!-- ======================================
             HEADER
        ====================================== -->

        <div class="card-header">

            <i class="bi bi-pencil-square"></i>

            Edit Tutor

        </div>


        <!-- ======================================
             BODY
        ====================================== -->

        <div class="card-body p-4">


            <!-- ======================================
                 EDIT FORM
            ====================================== -->

            <form method="POST">

                <div class="row">


                    <!-- ==================================
                         TUTOR NAME
                    ================================== -->

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Tutor Name
                        </label>

                        <input
                            type="text"
                            name="tutor_name"
                            class="form-control"
                            value="{{ tutor[0] }}"
                            required>

                    </div>


                    <!-- ==================================
                         DEPARTMENT
                    ================================== -->

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Department
                        </label>

                        <input
                            type="text"
                            name="department"
                            class="form-control"
                            value="{{ tutor[1] }}"
                            required>

                    </div>


                    <!-- ==================================
                         CLASS YEAR
                    ================================== -->

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Class Year
                        </label>

                        <select
                            name="class_year"
                            class="form-select">

                            <!-- NONE -->
                            <option
                                value=""
                                {% if not tutor[2] %}selected{% endif %}>
                                None
                            </option>

                            <!-- I YEAR -->
                            <option
                                value="I"
                                {% if tutor[2] == "I" %}selected{% endif %}>
                                I Year
                            </option>

                            <!-- II YEAR -->
                            <option
                                value="II"
                                {% if tutor[2] == "II" %}selected{% endif %}>
                                II Year
                            </option>

                            <!-- III YEAR -->
                            <option
                                value="III"
                                {% if tutor[2] == "III" %}selected{% endif %}>
                                III Year
                            </option>

                            <!-- IV YEAR -->
                            <option
                                value="IV"
                                {% if tutor[2] == "IV" %}selected{% endif %}>
                                IV Year
                            </option>

                        </select>

                    </div>


                    <!-- ==================================
                         SECTION
                    ================================== -->

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Section
                        </label>

                        <select
                            name="section"
                            class="form-select">

                            <!-- NONE -->
                            <option
                                value=""
                                {% if not tutor[3] %}selected{% endif %}>
                                None
                            </option>

                            <!-- SECTION A -->
                            <option
                                value="A"
                                {% if tutor[3] == "A" %}selected{% endif %}>
                                A
                            </option>

                            <!-- SECTION B -->
                            <option
                                value="B"
                                {% if tutor[3] == "B" %}selected{% endif %}>
                                B
                            </option>

                            <!-- SECTION C -->
                            <option
                                value="C"
                                {% if tutor[3] == "C" %}selected{% endif %}>
                                C
                            </option>

                        </select>

                    </div>


                    <!-- ==================================
                         EMAIL
                    ================================== -->

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Email
                        </label>

                        <input
                            type="email"
                            name="email"
                            class="form-control"
                            value="{{ tutor[4] }}"
                            required>

                    </div>


                    <!-- ==================================
                         USERNAME
                    ================================== -->

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Username
                        </label>

                        <input
                            type="text"
                            name="username"
                            class="form-control"
                            value="{{ tutor[5] }}"
                            required>

                    </div>


                    <!-- ==================================
                         PASSWORD
                    ================================== -->

                    <div class="col-md-12 mb-4">

                        <label class="form-label">

                            Password

                            <small class="text-muted">
                                (Leave blank if no change)
                            </small>

                        </label>

                        <input
                            type="password"
                            name="password"
                            class="form-control"
                            placeholder="Enter new password">

                    </div>


                </div>


                <!-- ======================================
                     BUTTONS
                ====================================== -->

                <div class="text-center">


                    <!-- UPDATE -->

                    <button
                        type="submit"
                        class="btn btn-success">

                        <i class="bi bi-check-circle-fill"></i>

                        Update Tutor

                    </button>


                    <!-- BACK -->

                    <a
                        href="{{ url_for('manage_tutor') }}"
                        class="btn btn-secondary ms-2">

                        <i class="bi bi-arrow-left-circle-fill"></i>

                        Back

                    </a>


                </div>


            </form>

        </div>

    </div>

</div>


<!-- Bootstrap JS -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>


</body>

</html>
