<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Edit Tutor</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

<style>

body{
    background:#eef3f7;
}

.card{
    border:none;
    border-radius:18px;
    box-shadow:0 10px 30px rgba(0,0,0,.1);
}

.card-header{
    background:#198754;
    color:white;
    font-size:28px;
    font-weight:bold;
    border-radius:18px 18px 0 0 !important;
}

.form-label{
    font-weight:600;
}

.form-control,
.form-select{
    height:48px;
    border-radius:10px;
}

.btn-success{
    border-radius:30px;
    padding:10px 30px;
}

.btn-secondary{
    border-radius:30px;
    padding:10px 30px;
}

</style>

</head>

<body>

<div class="container mt-5">

<div class="card">

<div class="card-header">

<i class="bi bi-pencil-square"></i>
Edit Tutor

</div>

<div class="card-body p-4">

<form method="POST">

<div class="row">

<!-- Tutor Name -->

<div class="col-md-6 mb-3">

<label class="form-label">
Tutor Name
</label>

<input
type="text"
name="tutor_name"
class="form-control"
value="{{ tutor[0] }}"
required>

</div>


<!-- Department -->

<div class="col-md-6 mb-3">

<label class="form-label">
Department
</label>

<input
type="text"
name="department"
class="form-control"
value="{{ tutor[1] }}"
required>

</div>


<!-- Class Year -->

<div class="col-md-6 mb-3">

<label class="form-label">
Class Year
</label>

<select
name="class_year"
class="form-select"
required>

<option value="I"
{% if tutor[2] == "I" %}selected{% endif %}>
I Year
</option>

<option value="II"
{% if tutor[2] == "II" %}selected{% endif %}>
II Year
</option>

<option value="III"
{% if tutor[2] == "III" %}selected{% endif %}>
III Year
</option>

<option value="IV"
{% if tutor[2] == "IV" %}selected{% endif %}>
IV Year
</option>

</select>

</div>


<!-- Section -->

<div class="col-md-6 mb-3">

<label class="form-label">
Section
</label>

<select
name="section"
class="form-select">

<!-- NONE OPTION -->

<option value=""
{% if not tutor[3] %}selected{% endif %}>
None
</option>

<option value="A"
{% if tutor[3] == "A" %}selected{% endif %}>
A
</option>

<option value="B"
{% if tutor[3] == "B" %}selected{% endif %}>
B
</option>

<option value="C"
{% if tutor[3] == "C" %}selected{% endif %}>
C
</option>

</select>

</div>


<!-- Email -->

<div class="col-md-6 mb-3">

<label class="form-label">
Email
</label>

<input
type="email"
name="email"
class="form-control"
value="{{ tutor[4] }}"
required>

</div>


<!-- Username -->

<div class="col-md-6 mb-3">

<label class="form-label">
Username
</label>

<input
type="text"
name="username"
class="form-control"
value="{{ tutor[5] }}"
required>

</div>


<!-- Password -->

<div class="col-md-12 mb-4">

<label class="form-label">

Password

<small class="text-muted">
(Leave blank if no change)
</small>

</label>

<input
type="password"
name="password"
class="form-control">

</div>

</div>


<!-- Buttons -->

<div class="text-center">

<button
type="submit"
class="btn btn-success">

<i class="bi bi-check-circle-fill"></i>
Update Tutor

</button>

<a
href="{{ url_for('manage_tutor') }}"
class="btn btn-secondary">

<i class="bi bi-arrow-left-circle-fill"></i>
Back

</a>

</div>

</form>

</div>

</div>

</div>

</body>

</html>
