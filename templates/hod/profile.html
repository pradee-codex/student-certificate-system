<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HOD Profile</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
          rel="stylesheet">

    <style>

        /* =====================================================
           HOD PROFILE - COMPACT DESIGN
           ===================================================== */

        body {
            background: #eef2f7;
            font-size: 12px;
        }

        .hod-profile-page {
            min-height: 100vh;
            padding: 20px;
        }

        /* ---------- PROFILE CARD ---------- */

        .profile-card {
            max-width: 1000px;
            margin: 20px auto;
            border: none;
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 6px 20px rgba(0,0,0,.12);
        }

        /* ---------- HEADER ---------- */

        .profile-header {
            background: #198754;
            color: white;
            padding: 22px 25px;
        }

        .profile-header .row {
            min-height: 135px;
        }

        /* ---------- PROFILE IMAGE ---------- */

        .profile-img {
            width: 115px;
            height: 115px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid white;
            background: white;
        }

        /* ---------- PHOTO BUTTON ---------- */

        .photo-label {
            font-size: 10px;
            padding: 6px 12px !important;
            border-radius: 6px;
            cursor: pointer;
        }

        .photo-label i {
            font-size: 11px;
        }

        .photo-input {
            font-size: 10px;
            width: 170px;
        }

        /* ---------- HEADER TEXT ---------- */

        .profile-header h1 {
            font-size: 23px;
            margin-bottom: 7px;
        }

        .profile-header h4 {
            font-size: 15px;
            margin-bottom: 5px;
        }

        .profile-header p {
            font-size: 10px;
            margin-bottom: 0;
        }

        /* ---------- BODY ---------- */

        .profile-card .card-body {
            padding: 22px 25px !important;
        }

        /* ---------- FORM ---------- */

        .form-label {
            font-size: 11px;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .form-control {
            height: 36px;
            padding: 6px 10px;
            font-size: 11px;
            border-radius: 6px;
        }

        .form-control:focus {
            box-shadow: none;
        }

        .mb-4 {
            margin-bottom: 13px !important;
        }

        /* ---------- BUTTONS ---------- */

        .btn-save,
        .btn-back {
            padding: 7px 20px;
            font-size: 11px;
            border-radius: 6px;
        }

        .btn-save {
            background: #198754;
            color: white;
            border: 1px solid #198754;
        }

        .btn-save:hover {
            background: #157347;
            color: white;
        }

        .btn-back {
            padding: 7px 20px;
        }

        /* ---------- MOBILE ---------- */

        @media (max-width: 768px) {

            .hod-profile-page {
                padding: 10px;
            }

            .profile-card {
                margin: 10px auto;
            }

            .profile-header {
                padding: 18px;
            }

            .profile-header .row {
                text-align: center;
            }

            .profile-img {
                width: 100px;
                height: 100px;
            }

            .profile-header h1 {
                font-size: 20px;
                margin-top: 12px;
            }

            .profile-header h4 {
                font-size: 14px;
            }

            .profile-card .card-body {
                padding: 18px !important;
            }

        }

        @media (max-width: 576px) {

            .profile-header h1 {
                font-size: 18px;
            }

            .profile-img {
                width: 90px;
                height: 90px;
            }

            .photo-input {
                width: 150px;
            }

            .btn-save,
            .btn-back {
                padding: 7px 15px;
                font-size: 10px;
            }

        }

    </style>

</head>


<body>

<div class="hod-profile-page">

<form action="/update_hod_profile"
      method="POST"
      enctype="multipart/form-data">

    <div class="card profile-card">


        <!-- =================================================
             PROFILE HEADER
        ================================================== -->

        <div class="profile-header">

            <div class="row align-items-center">


                <!-- PROFILE PHOTO -->

                <div class="col-md-3 text-center">

                    {% if hod[6] %}

                        <img
                            src="{{ url_for('static', filename='uploads/profile/' + hod[6]) }}"
                            class="profile-img">

                    {% else %}

                        <img
                            src="{{ url_for('static', filename='uploads/profile/default.png') }}"
                            class="profile-img">

                    {% endif %}


                    <div class="mt-2">

                        <label class="btn btn-light photo-label">

                            <i class="bi bi-camera-fill"></i>

                            Change Photo

                            <input
                                type="file"
                                name="profile_photo"
                                accept=".jpg,.jpeg,.png"
                                class="form-control photo-input mt-1">

                        </label>

                    </div>

                </div>


                <!-- PROFILE INFORMATION -->

                <div class="col-md-9">

                    <h1>

                        <i class="bi bi-person-circle"></i>

                        HOD Profile

                    </h1>

                    <h4>

                        Welcome, {{ hod[1] }}

                    </h4>

                    <p>

                        Department :
                        {{ hod[2] }}

                    </p>

                </div>

            </div>

        </div>


        <!-- =================================================
             PROFILE FORM
        ================================================== -->

        <div class="card-body">

            <div class="row">


                <!-- FULL NAME -->

                <div class="col-md-6 mb-4">

                    <label class="form-label">

                        Full Name

                    </label>

                    <input
                        type="text"
                        name="name"
                        class="form-control"
                        value="{{ hod[1] }}"
                        required>

                </div>


                <!-- DEPARTMENT -->

                <div class="col-md-6 mb-4">

                    <label class="form-label">

                        Department

                    </label>

                    <input
                        type="text"
                        class="form-control"
                        value="{{ hod[2] }}"
                        readonly>

                </div>


                <!-- EMAIL -->

                <div class="col-md-6 mb-4">

                    <label class="form-label">

                        Email

                    </label>

                    <input
                        type="email"
                        name="email"
                        class="form-control"
                        value="{{ hod[3] }}">

                </div>


                <!-- PHONE -->

                <div class="col-md-6 mb-4">

                    <label class="form-label">

                        Phone Number

                    </label>

                    <input
                        type="text"
                        name="phone"
                        class="form-control"
                        value="{{ hod[4] }}">

                </div>


                <!-- USERNAME -->

                <div class="col-md-6 mb-4">

                    <label class="form-label">

                        Username

                    </label>

                    <input
                        type="text"
                        class="form-control"
                        value="{{ hod[5] }}"
                        readonly>

                </div>


            </div>


            <!-- BUTTONS -->

            <div class="text-center mt-2">

                <button
                    type="submit"
                    class="btn btn-save">

                    <i class="bi bi-check-circle-fill"></i>

                    Update Profile

                </
