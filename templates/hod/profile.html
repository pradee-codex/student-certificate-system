<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HOD Profile</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <style>

        body{
            background:#eef2f7;
        }

        .profile-card{
            max-width:1100px;
            margin:40px auto;
            border:none;
            border-radius:18px;
            overflow:hidden;
            box-shadow:0 10px 30px rgba(0,0,0,.15);
        }

        .profile-header{
            background:#198754;
            color:white;
            padding:35px;
        }

        .profile-img{
            width:160px;
            height:160px;
            border-radius:50%;
            object-fit:cover;
            border:5px solid white;
            background:white;
        }

        .btn-save{
            background:#198754;
            color:white;
            padding:10px 30px;
            border-radius:8px;
        }

        .btn-back{
            padding:10px 30px;
            border-radius:8px;
        }

    </style>

</head>

<body>

<form action="/update_hod_profile"
      method="POST"
      enctype="multipart/form-data">

<div class="card profile-card">

    <div class="profile-header">

        <div class="row align-items-center">

            <div class="col-md-3 text-center">

               {% if hod[6] %}
<img src="{{ url_for('static', filename='uploads/profile/' + hod[6]) }}"
     class="profile-img">
{% else %}
<img src="{{ url_for('static', filename='uploads/profile/default.png') }}"
     class="profile-img">
{% endif %}

                <br><br>

                <label class="btn btn-light">

                    <i class="bi bi-camera-fill"></i>

                    Change Photo

                    <input
                        type="file"
                        name="profile_photo"
                        accept=".jpg,.jpeg,.png"
                        class="form-control mt-2">

                </label>

            </div>

            <div class="col-md-9">

                <h1>

                    <i class="bi bi-person-circle"></i>

                    HOD Profile

                </h1>

                <h4>

                    Welcome, {{ hod[1] }}

                </h4>

                <p>

                    Department :
                    {{ hod[2] }}

                </p>

            </div>

        </div>

    </div>

    <div class="card-body p-5">

        <div class="row">

            <div class="col-md-6 mb-4">

                <label class="form-label">

                    Full Name

                </label>

                <input
                    type="text"
                    name="name"
                    class="form-control"
                    value="{{ hod[1] }}"
                    required>

            </div>

            <div class="col-md-6 mb-4">

                <label class="form-label">

                    Department

                </label>

                <input
                    type="text"
                    class="form-control"
                    value="{{ hod[2] }}"
                    readonly>

            </div>

            <div class="col-md-6 mb-4">

                <label class="form-label">

                    Email

                </label>

                <input
                    type="email"
                    name="email"
                    class="form-control"
                    value="{{ hod[3] }}">

            </div>

            <div class="col-md-6 mb-4">

                <label class="form-label">

                    Phone Number

                </label>

                <input
                    type="text"
                    name="phone"
                    class="form-control"
                    value="{{ hod[4] }}">

            </div>

            <div class="col-md-6 mb-4">

                <label class="form-label">

                    Username

                </label>

                <input
                    type="text"
                    class="form-control"
                    value="{{ hod[5] }}"
                    readonly>

            </div>

        </div>

        <div class="text-center mt-3">

            <button
                type="submit"
                class="btn btn-save">

                <i class="bi bi-check-circle-fill"></i>

                Update Profile

            </button>

            <a href="/hod"
               class="btn btn-secondary btn-back ms-2">

                <i class="bi bi-arrow-left-circle-fill"></i>

                Back

            </a>

        </div>

    </div>

</div>

</form>

</body>

</html>
