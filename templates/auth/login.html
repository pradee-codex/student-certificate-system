<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Certificate Management System</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
          rel="stylesheet">

    <!-- Your CSS -->
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

    <style>

        /* ================================
           RESET
        ================================= */

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
        }

        body {
            overflow: hidden;
        }


        /* ================================
           LOGIN CONTAINER
        ================================= */

        .login-container {
            min-height: 100vh;
            width: 100%;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 15px;
        }


        /* ================================
           SMALL LOGIN CARD
        ================================= */

        .login-card {
            width: 100%;
            max-width: 390px !important;

            padding: 22px 28px !important;

            border-radius: 20px !important;

            margin: auto;
        }


        /* ================================
           LOGO
        ================================= */

        .login-card .logo {
            display: flex;
            justify-content: center;
            align-items: center;

            margin-bottom: 8px !important;
        }

        .login-card .logo img {
            width: 75px !important;
            height: 75px !important;

            border-radius: 50% !important;

            object-fit: contain;

            background: #ffffff;

            padding: 4px;
        }


        /* ================================
           TITLE
        ================================= */

        .login-card h2 {
            font-size: 25px !important;

            line-height: 1.1;

            margin: 3px 0 2px !important;

            font-weight: 700;
        }

        .login-card h5 {
            font-size: 18px !important;

            margin: 0 0 2px !important;

            font-weight: 600;
        }

        .login-card p {
            font-size: 11px !important;

            margin-bottom: 13px !important;
        }


        /* ================================
           FLASH MESSAGE
        ================================= */

        .login-card .alert {
            font-size: 11px;

            padding: 7px 10px;

            margin-bottom: 10px;

            border-radius: 7px;
        }


        /* ================================
           LABEL
        ================================= */

        .login-card .form-label {
            font-size: 12px !important;

            font-weight: 600;

            margin-bottom: 4px !important;
        }


        /* ================================
           INPUT GROUP
        ================================= */

        .login-card .input-group {
            height: 42px;
        }

        .login-card .input-group-text {
            width: 42px;

            justify-content: center;

            font-size: 14px;

            border-radius: 8px 0 0 8px !important;
        }

        .login-card .form-control {
            height: 42px !important;

            font-size: 12px !important;

            padding: 6px 10px !important;
        }

        .login-card .input-group .btn {
            height: 42px;

            width: 42px;

            padding: 0;

            font-size: 14px;

            border-radius: 0 8px 8px 0 !important;
        }


        /* ================================
           FORM SPACING
        ================================= */

        .login-card .mb-3 {
            margin-bottom: 10px !important;
        }


        /* ================================
           FORGOT PASSWORD
        ================================= */

        .login-card .text-end {
            margin-bottom: 11px !important;
        }

        .login-card .text-end a {
            font-size: 11px !important;

            font-weight: 500;
        }


        /* ================================
           LOGIN BUTTON
        ================================= */

        .login-card .login-btn {
            height: 42px !important;

            padding: 6px 12px !important;

            border-radius: 8px !important;

            font-size: 13px !important;

            font-weight: 600;
        }


        /* ================================
           HR
        ================================= */

        .login-card hr {
            margin: 13px 0 9px !important;
        }


        /* ================================
           FOOTER
        ================================= */

        .login-card small {
            font-size: 8px !important;

            line-height: 1.3;

            display: block;
        }


        /* ================================
           TABLET / MOBILE
        ================================= */

        @media (max-width: 768px) {

            .login-container {
                padding: 12px;
            }

            .login-card {
                max-width: 360px !important;

                padding: 20px 23px !important;

                border-radius: 18px !important;
            }

            .login-card .logo img {
                width: 68px !important;
                height: 68px !important;
            }

            .login-card h2 {
                font-size: 23px !important;
            }

            .login-card h5 {
                font-size: 17px !important;
            }
        }


        /* ================================
           SMALL MOBILE
        ================================= */

        @media (max-width: 500px) {

            .login-card {
                max-width: 340px !important;

                padding: 18px 20px !important;
            }

            .login-card .logo img {
                width: 62px !important;
                height: 62px !important;
            }

            .login-card h2 {
                font-size: 21px !important;
            }

            .login-card h5 {
                font-size: 16px !important;
            }

            .login-card p {
                font-size: 10px !important;
            }

            .login-card .input-group {
                height: 40px;
            }

            .login-card .input-group-text {
                width: 40px;
            }

            .login-card .form-control {
                height: 40px !important;
            }

            .login-card .input-group .btn {
                height: 40px;
                width: 40px;
            }

            .login-card .login-btn {
                height: 40px !important;

                font-size: 12px !important;
            }
        }

    </style>

</head>


<body>

    <!-- =================================
         BACKGROUND
    ================================== -->

    <div class="background"></div>


    <!-- =================================
         LOGIN CONTAINER
    ================================== -->

    <div class="login-container">

        <div class="login-card">


            <!-- =================================
                 LOGO + TITLE
            ================================== -->

            <div class="text-center">

                <div class="logo">

                    <img
                        src="{{ url_for('static', filename='images/logo.png') }}"
                        alt="College Logo">

                </div>


                <h2>
                    Student Certificate
                </h2>


                <h5>
                    Management System
                </h5>


                <p class="text-muted">
                    Secure Login Portal
                </p>

            </div>


            <!-- =================================
                 FLASH MESSAGE
            ================================== -->

            {% with messages = get_flashed_messages() %}

                {% if messages %}

                    <div class="alert alert-danger alert-dismissible fade show">

                        {{ messages[0] }}

                        <button
                            type="button"
                            class="btn-close"
                            data-bs-dismiss="alert">
                        </button>

                    </div>

                {% endif %}

            {% endwith %}


            <!-- =================================
                 LOGIN FORM
            ================================== -->

            <form action="/login" method="POST">


                <!-- USERNAME -->

                <div class="mb-3">

                    <label class="form-label">
                        Username
                    </label>

                    <div class="input-group">

                        <span class="input-group-text">
                            <i class="bi bi-person-fill"></i>
                        </span>

                        <input
                            type="text"
                            class="form-control"
                            name="username"
                            placeholder="Enter Username"
                            required>

                    </div>

                </div>


                <!-- PASSWORD -->

                <div class="mb-3">

                    <label class="form-label">
                        Password
                    </label>

                    <div class="input-group">

                        <span class="input-group-text">
                            <i class="bi bi-lock-fill"></i>
                        </span>

                        <input
                            id="password"
                            type="password"
                            class="form-control"
                            name="password"
                            placeholder="Enter Password"
                            required>

                        <button
                            class="btn btn-outline-secondary"
                            type="button"
                            onclick="togglePassword()">

                            <i id="eye"
                               class="bi bi-eye">
                            </i>

                        </button>

                    </div>

                </div>


                <!-- FORGOT PASSWORD -->

                <div class="text-end mb-3">

                    <a
                        href="/forgot_password"
                        class="text-decoration-none">

                        <i class="bi bi-key-fill"></i>

                        Forgot Password?

                    </a>

                </div>


                <!-- LOGIN BUTTON -->

                <button
                    type="submit"
                    class="btn btn-primary login-btn w-100">

                    <i class="bi bi-box-arrow-in-right"></i>

                    Login

                </button>

            </form>


            <!-- =================================
                 FOOTER
            ================================== -->

            <hr>

            <div class="text-center">

                <small>

                    © 2026 Student Certificate Management System

                    <br>

                    Designed By PRADEEP From AIDS

                </small>

            </div>


        </div>

    </div>


    <!-- =================================
         BOOTSTRAP JS
    ================================== -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>


    <!-- =================================
         PASSWORD TOGGLE
    ================================== -->

    <script>

        function togglePassword() {

            let password =
                document.getElementById("password");

            let eye =
                document.getElementById("eye");


            if (password.type === "password") {

                password.type = "text";

                eye.className =
                    "bi bi-eye-slash";

            }

            else {

                password.type = "password";

                eye.className =
                    "bi bi-eye";

            }

        }


        /* LOGIN LOADING */

        document.querySelector("form").addEventListener(
            "submit",
            function () {

                document.querySelector(".login-btn").innerHTML =
                    '<span class="spinner-border spinner-border-sm"></span> Logging in...';

            }
        );

    </script>

</body>

</html>
