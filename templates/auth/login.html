<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
Student Certificate Management System
</title>


<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" 
rel="stylesheet">


<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
rel="stylesheet">


<link rel="stylesheet"
href="{{ url_for('static', filename='css/style.css') }}">


</head>


<body>


<div class="background"></div>



<div class="login-container">



<div class="login-card">





<!-- Logo -->


<div class="text-center">


<div class="logo">
    <img src="{{ url_for('static', filename='images/logo.png') }}" alt="College Logo">
</div>


<h2>
Student Certificate
</h2>


<h5>
Management System
</h5>


<p class="text-muted">

Secure Login Portal

</p>


</div>







<!-- Flash Message -->


{% with messages = get_flashed_messages() %}

{% if messages %}


<div class="alert alert-danger alert-dismissible fade show">


{{ messages[0] }}



<button type="button"

class="btn-close"

data-bs-dismiss="alert">

</button>



</div>


{% endif %}

{% endwith %}









<!-- Login Form -->


<form action="/login" method="POST">






<!-- Username -->


<div class="mb-3">


<label class="form-label">

Username

</label>



<div class="input-group">



<span class="input-group-text">

<i class="bi bi-person-fill"></i>

</span>





<input

type="text"

class="form-control"

name="username"

placeholder="Enter Username"

required>




</div>


</div>









<!-- Password -->


<div class="mb-3">


<label class="form-label">

Password

</label>



<div class="input-group">



<span class="input-group-text">

<i class="bi bi-lock-fill"></i>

</span>





<input

id="password"

type="password"

class="form-control"

name="password"

placeholder="Enter Password"

required>





<button

class="btn btn-outline-secondary"

type="button"

onclick="togglePassword()">



<i id="eye"

class="bi bi-eye">

</i>



</button>





</div>


</div>









<!-- Forgot Password -->


<div class="text-end mb-3">


<a href="/forgot_password"
class="text-decoration-none">


<i class="bi bi-key-fill"></i>

Forgot Password?


</a>



</div>









<!-- Login Button -->


<button

type="submit"

class="btn btn-primary login-btn w-100">



<i class="bi bi-box-arrow-in-right"></i>


Login



</button>





</form>







<hr>






<div class="text-center">


<small>

© 2026 Student Certificate Management System | Designed By PRADEEP From AIDS

</small>


</div>






</div>


</div>









<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>






<script>


function togglePassword(){



let password = document.getElementById("password");


let eye = document.getElementById("eye");



if(password.type === "password"){


password.type="text";


eye.className="bi bi-eye-slash";


}

else{


password.type="password";


eye.className="bi bi-eye";


}



}







document.querySelector("form").addEventListener("submit",function(){



document.querySelector(".login-btn").innerHTML =


'<span class="spinner-border spinner-border-sm"></span> Logging in...';



});



</script>





</body>

</html>
