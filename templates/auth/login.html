<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Student Certificate Management System</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
rel="stylesheet">

<link rel="stylesheet"
href="{{ url_for('static', filename='css/style.css') }}">

<style>

/* =========================================================
   COMPACT LOGIN PAGE
========================================================= */

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: 'Poppins', sans-serif;
    font-size: 12px;
}


/* =========================
   BACKGROUND
========================= */

.background {
    position: fixed;
    inset: 0;
    z-index: -1;
}


/* =========================
   LOGIN CONTAINER
========================= */

.login-container {
    min-height: 100vh;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 20px;
}


/* =========================
   LOGIN CARD
========================= */

.login-card {
    width: 100%;
    max-width: 400px;

    padding: 25px 28px;

    border-radius: 18px;

    background: rgba(255, 255, 255, 0.94);

    box-shadow:
        0 12px 35px rgba(0, 0, 0, 0.15);

    backdrop-filter: blur(12px);
}


/* =========================
   LOGO
========================= */

.logo {
    margin-bottom: 10px;
}

.logo img {
    width: 72px !important;
    height: 72px !important;

    object-fit: contain;

    border-radius: 50%;
}


/* =========================
   TITLE
========================= */

.login-card h2 {
    margin: 8px 0 2px;

    font-size: 21px !important;

    font-weight: 600;
}

.login-card h5 {
    margin: 0 0 5px;

    font-size: 14px !important;

    font-weight: 500;
}

.login-card .text-muted {
    margin-bottom: 18px;

    font-size: 10px !important;
}


/* =========================
   FLASH MESSAGE
========================= */

.alert {
    padding: 8px 10px !important;

    margin-bottom: 14px !important;

    font-size: 10px !important;

    border-radius: 7px !important;
}


/* =========================
   FORM
========================= */

.mb-3 {
    margin-bottom: 13px !important;
}

.form-label {
    margin-bottom: 5px !important;

    font-size: 11px !important;

    font-weight: 500;
}


/* =========================
   INPUT GROUP
========================= */

.input-group {
    height: 36px;
}

.input-group-text {
    width: 38px;

    padding: 0;

    justify-content: center;

    font-size: 12px;

    background: #f8fafc;
}

.form-control {
    height: 36px !important;

    padding: 6px 10px !important;

    font-size: 11px !important;

    border-radius: 0 7px 7px 0 !important;
}

.input-group .input-group-text {
    border-radius: 7px 0 0 7px;
}

.form-control::placeholder {
    font-size: 10px;
}


/* =========================
   PASSWORD BUTTON
========================= */

.input-group .btn {
    height: 36px;

    padding: 0 10px;

    font-size: 12px;

    border-radius: 0 7px 7px 0;
}


/* =========================
   FORGOT PASSWORD
========================= */

.text-end {
    margin-bottom: 13px !important;
}

.text-end a {
    font-size: 10px !important;
}


/* =========================
   LOGIN BUTTON
========================= */

.login-btn {
    height: 37px !important;

    padding: 7px 15px !important;

    font-size: 11px !important;

    font-weight: 500;

    border-radius: 7px !important;
}

.login-btn i {
    margin-right: 4px;
}


/* =========================
   HR
========================= */

.login-card hr {
    margin: 18px 0 12px;

    opacity: .15;
}


/* =========================
   FOOTER
========================= */

.login-card small {
    font-size: 8px !important;

    line-height: 1.5;

    color: #666;
}


/* =========================
   MOBILE
========================= */

@media (max-width: 500px) {

    .login-container {
        padding: 15px;
    }

    .login-card {
        max-width: 360px;

        padding: 22px 20px;
    }

    .logo img {
        width: 65px !important;
        height: 65px !important;
    }

    .login-card h2 {
        font-size: 19px !important;
    }

    .login-card h5 {
        font-size: 13px !important;
    }

}

</style>

</head>


<body>


<div class="background"></div>


<div class="login-container">


<div class="login-card">


<!-- Logo -->

<div class="text-center">

<div class="logo">

<img
src="{{ url_for('static', filename='images/logo.png') }}"
alt="College Logo">

</div>


<h2>
Student Certificate
</h2>


<h5>
Management System
</h5>


<p class="text-muted">
Secure Login Portal
</p>

</div>


<!-- Flash Message -->

{% with messages = get_flashed_messages() %}

{% if messages %}

<div class="alert alert-danger alert-dismissible fade show">

{{ messages[0] }}

<button
type="button"
class="btn-close"
data-bs-dismiss="alert">
</button>

</div>

{% endif %}

{% endwith %}


<!-- Login Form -->

<form action="/login" method="POST">


<!-- Username -->

<div class="mb-3">

<label class="form-label">
Username
</label>

<div class="input-group">

<span class="input-group-text">
<i class="bi bi-person-fill"></i>
</span>

<input
type="text"
class="form-control"
name="username"
placeholder="Enter Username"
required>

</div>

</div>


<!-- Password -->

<div class="mb-3">

<label class="form-label">
Password
</label>

<div class="input-group">

<span class="input-group-text">
<i class="bi bi-lock-fill"></i>
</span>

<input
id="password"
type="password"
class="form-control"
name="password"
placeholder="Enter Password"
required>

<button
class="btn btn-outline-secondary"
type="button"
onclick="togglePassword()">

<i id="eye" class="bi bi-eye"></i>

</button>

</div>

</div>


<!-- Forgot Password -->

<div class="text-end mb-3">

<a
href="/forgot_password"
class="text-decoration-none">

<i class="bi bi-key-fill"></i>

Forgot Password?

</a>

</div>


<!-- Login Button -->

<button
type="submit"
class="btn btn-primary login-btn w-100">

<i class="bi bi-box-arrow-in-right"></i>

Login

</button>


</form>


<hr>


<div class="text-center">

<small>
© 2026 Student Certificate Management System |
Designed By PRADEEP From AIDS
</small>

</div>


</div>

</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>


<script>

function togglePassword() {

    let password = document.getElementById("password");

    let eye = document.getElementById("eye");

    if (password.type === "password") {

        password.type = "text";

        eye.className = "bi bi-eye-slash";

    } else {

        password.type = "password";

        eye.className = "bi bi-eye";

    }

}


document.querySelector("form").addEventListener("submit", function() {

    document.querySelector(".login-btn").innerHTML =
        '<span class="spinner-border spinner-border-sm"></span> Logging in...';

});

</script>


</body>

</html>
