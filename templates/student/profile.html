<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Student Profile</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

<style>

body{
    background:#eef3f8;
}

.profile-card{
    max-width:1100px;
    margin:40px auto;
    border:none;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 15px 35px rgba(0,0,0,.15);
}

.profile-header{
    background:#198754;
    color:white;
    padding:35px;
}

.profile-img{
    width:170px;
    height:170px;
    border-radius:50%;
    object-fit:cover;
    border:6px solid #fff;
    background:#fff;
}

.upload-btn{
    margin-top:15px;
}

.form-control{
    height:48px;
}

.btn-save{
    background:#198754;
    color:white;
    border:none;
    padding:12px 35px;
    border-radius:10px;
    font-weight:bold;
}

.btn-save:hover{
    background:#157347;
    color:white;
}

.btn-back{
    padding:12px 35px;
    border-radius:10px;
}

</style>

</head>

<body>

<div class="card profile-card">

<div class="profile-header">

<div class="row align-items-center">

<div class="col-md-3 text-center">

{% if student[7] %}

<img
src="{{ url_for('static', filename='uploads/profile/' + student[7]) }}"
class="profile-img">

{% else %}

<img
src="{{ url_for('static', filename='uploads/default.png') }}"
class="profile-img">

{% endif %}

<form action="/upload_student_photo" method="POST" enctype="multipart/form-data">

<div class="mt-3">

<input
type="file"
name="profile_photo"
class="form-control"
required>

</div>

<button
type="submit"
class="btn btn-light upload-btn">

<i class="bi bi-upload"></i>

Upload Photo

</button>

</form>

</div>

<div class="col-md-9">

<h2>

<i class="bi bi-person-circle"></i>

Student Profile

</h2>

<h3>

Welcome, {{ student[2] }}

</h3>

<h5>

Register No : {{ student[1] }}

</h5>

</div>

</div>

</div>

<div class="card-body p-5">

<form action="/update_student_profile" method="POST">

<div class="row">

<div class="col-md-6 mb-4">

<label class="form-label">

Student Name

</label>

<input
type="text"
name="student_name"
class="form-control"
value="{{ student[2] }}"
required>

</div>

<div class="col-md-6 mb-4">

<label class="form-label">

Register Number

</label>

<input
type="text"
class="form-control"
value="{{ student[1] }}"
readonly>

</div>

<div class="col-md-6 mb-4">

<label class="form-label">

Department

</label>

<input
type="text"
class="form-control"
value="{{ student[3] }}"
readonly>

</div>

<div class="col-md-6 mb-4">

<label class="form-label">

Year

</label>

<input
type="text"
class="form-control"
value="{{ student[4] }}"
readonly>

</div>

<div class="col-md-6 mb-4">

<label class="form-label">

Email

</label>

<input
type="email"
name="email"
class="form-control"
value="{{ student[5] }}">

</div>

<div class="col-md-6 mb-4">

<label class="form-label">

Phone Number

</label>

<input
type="text"
name="phone"
class="form-control"
value="{{ student[6] }}">

</div>

</div>

<div class="text-center mt-4">

<button
type="submit"
class="btn btn-save">

<i class="bi bi-check-circle-fill"></i>

Update Profile

</button>

<a
href="/student"
class="btn btn-secondary btn-back ms-3">

<i class="bi bi-arrow-left-circle-fill"></i>

Back

</a>

</div>

</form>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
