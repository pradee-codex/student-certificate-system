<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Student Profile</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

<style>

*{
    box-sizing:border-box;
}

body{
    background:#eef3f8;
    font-family:"Segoe UI",Arial,sans-serif;
    font-size:12px;
    margin:0;
}

/* MAIN PROFILE CARD */

.profile-card{
    max-width:1000px;
    margin:20px auto;
    border:none;
    border-radius:14px;
    overflow:hidden;
    box-shadow:0 8px 22px rgba(0,0,0,.12);
}

/* HEADER */

.profile-header{
    background:#198754;
    color:white;
    padding:22px 25px;
}

.profile-header .row{
    margin:0;
}

.profile-img{
    width:115px;
    height:115px;
    border-radius:50%;
    object-fit:cover;
    border:4px solid #fff;
    background:#fff;
}

.profile-header h2{
    font-size:21px;
    font-weight:600;
    margin-bottom:8px;
}

.profile-header h3{
    font-size:16px;
    font-weight:500;
    margin-bottom:6px;
}

.profile-header h5{
    font-size:11px;
    font-weight:400;
    margin:0;
}

/* PHOTO UPLOAD */

.profile-header .mt-3{
    margin-top:10px !important;
}

.profile-header .form-control{
    height:34px;
    padding:5px 8px;
    font-size:10px;
    border-radius:6px;
}

.upload-btn{
    margin-top:8px;
    padding:6px 12px;
    font-size:10px;
    border-radius:6px;
}

/* BODY */

.profile-card .card-body{
    padding:22px 25px !important;
}

.form-label{
    font-size:11px;
    font-weight:600;
    margin-bottom:5px;
    color:#333;
}

.form-control{
    height:36px;
    padding:6px 10px;
    font-size:11px;
    border-radius:6px;
}

.form-control:focus{
    box-shadow:none;
    border-color:#198754;
}

/* FORM SPACING */

.profile-card .mb-4{
    margin-bottom:13px !important;
}

/* BUTTONS */

.btn-save{
    background:#198754;
    color:white;
    border:none;
    padding:7px 20px;
    border-radius:7px;
    font-size:11px;
    font-weight:600;
}

.btn-save:hover{
    background:#157347;
    color:white;
}

.btn-back{
    padding:7px 20px;
    border-radius:7px;
    font-size:11px;
}

/* BUTTON AREA */

.profile-card .text-center{
    margin-top:10px !important;
}

/* MOBILE */

@media(max-width:768px){

    .profile-card{
        margin:12px;
        border-radius:12px;
    }

    .profile-header{
        padding:18px;
    }

    .profile-img{
        width:95px;
        height:95px;
    }

    .profile-header h2{
        font-size:19px;
    }

    .profile-header h3{
        font-size:14px;
    }

    .profile-header h5{
        font-size:10px;
    }

    .profile-card .card-body{
        padding:18px !important;
    }

    .btn-save,
    .btn-back{
        padding:7px 15px;
        font-size:10px;
    }

}

</style>

</head>

<body>

<div class="card profile-card">

    <!-- PROFILE HEADER -->

    <div class="profile-header">

        <div class="row align-items-center">

            <div class="col-md-3 text-center">

                {% if student[7] %}

                <img
                    src="{{ url_for('static', filename='uploads/profile/' + student[7]) }}"
                    class="profile-img"
                    alt="Student Profile">

                {% else %}

                <img
                    src="{{ url_for('static', filename='uploads/default.png') }}"
                    class="profile-img"
                    alt="Default Profile">

                {% endif %}

                <form
                    action="/upload_student_photo"
                    method="POST"
                    enctype="multipart/form-data">

                    <div class="mt-3">

                        <input
                            type="file"
                            name="profile_photo"
                            class="form-control"
                            required>

                    </div>

                    <button
                        type="submit"
                        class="btn btn-light upload-btn">

                        <i class="bi bi-upload"></i>
                        Upload Photo

                    </button>

                </form>

            </div>

            <div class="col-md-9">

                <h2>
                    <i class="bi bi-person-circle"></i>
                    Student Profile
                </h2>

                <h3>
                    Welcome, {{ student[2] }}
                </h3>

                <h5>
                    Register No : {{ student[1] }}
                </h5>

            </div>

        </div>

    </div>


    <!-- PROFILE FORM -->

    <div class="card-body">

        <form action="/update_student_profile" method="POST">

            <div class="row">

                <!-- Student Name -->

                <div class="col-md-6 mb-4">

                    <label class="form-label">
                        Student Name
                    </label>

                    <input
                        type="text"
                        name="student_name"
                        class="form-control"
                        value="{{ student[2] }}"
                        required>

                </div>


                <!-- Register Number -->

                <div class="col-md-6 mb-4">

                    <label class="form-label">
                        Register Number
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        value="{{ student[1] }}"
                        readonly>

                </div>


                <!-- Department -->

                <div class="col-md-6 mb-4">

                    <label class="form-label">
                        Department
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        value="{{ student[3] }}"
                        readonly>

                </div>


                <!-- Year -->

                <div class="col-md-6 mb-4">

                    <label class="form-label">
                        Year
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        value="{{ student[4] }}"
                        readonly>

                </div>


                <!-- Email -->

                <div class="col-md-6 mb-4">

                    <label class="form-label">
                        Email
                    </label>

                    <input
                        type="email"
                        name="email"
                        class="form-control"
                        value="{{ student[5] }}">

                </div>


                <!-- Phone -->

                <div class="col-md-6 mb-4">

                    <label class="form-label">
                        Phone Number
                    </label>

                    <input
                        type="text"
                        name="phone"
                        class="form-control"
                        value="{{ student[6] }}">

                </div>

            </div>


            <!-- ACTION BUTTONS -->

            <div class="text-center mt-4">

                <button
                    type="submit"
                    class="btn btn-save">

                    <i class="bi bi-check-circle-fill"></i>
                    Update Profile

                </button>

                <a
                    href="/student"
                    class="btn btn-secondary btn-back ms-2">

                    <i class="bi bi-arrow-left-circle-fill"></i>
                    Back

                </a>

            </div>

        </form>

    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
