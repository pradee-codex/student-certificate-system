<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Profile</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

<style>

body{
    background:#f4f7fa;
}

.profile-card{
    border:none;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 10px 30px rgba(0,0,0,.15);
}

.profile-header{
    background:#198754;
    color:white;
    padding:30px;
}

.profile-img{

    width:170px;
    height:170px;

    border-radius:50%;

    border:6px solid white;

    object-fit:cover;

    background:white;

}

.form-control{

    height:50px;
    border-radius:10px;

}

.btn-save{

    background:#198754;
    color:white;
    border-radius:10px;
    padding:12px;

    font-size:18px;

}

.btn-save:hover{

    background:#157347;
    color:white;

}

</style>

</head>

<body>

<div class="container mt-5 mb-5">

<div class="card profile-card">

<div class="profile-header">

<div class="row align-items-center">

<div class="col-md-3 text-center">

{% if admin[5] %}

<img
src="{{ url_for('static', filename='uploads/profile/' + admin[5]) }}"
class="profile-img">

{% else %}

<img
src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png"
class="profile-img">

{% endif %}

</div>

<div class="col-md-9">

<h2>

<i class="bi bi-person-circle"></i>

Administrator Profile

</h2>

<h5 class="mt-3">

Welcome,

{{ admin[2] if admin[2] else admin[1] }}

</h5>

<p class="mb-0">

Manage your profile information

</p>

</div>

</div>

</div>

<div class="card-body p-5">

<form action="/update_admin_profile" method="POST">

<div class="row">

<div class="col-md-6 mb-4">

<label class="form-label">

Full Name

</label>

<input
type="text"
name="full_name"
class="form-control"
value="{{ admin[2] if admin[2] else '' }}"
required>

</div>

<div class="col-md-6 mb-4">

<label class="form-label">

Username

</label>

<input
type="text"
class="form-control"
value="{{ admin[1] }}"
readonly>

</div>

<div class="col-md-6 mb-4">

<label class="form-label">

Email

</label>

<input
type="email"
name="email"
class="form-control"
value="{{ admin[3] if admin[3] else '' }}">

</div>

<div class="col-md-6 mb-4">

<label class="form-label">

Phone Number

</label>

<input
type="text"
name="phone"
class="form-control"
value="{{ admin[4] if admin[4] else '' }}">

</div>

</div>

<div class="text-center mt-4">

<button
class="btn btn-save px-5"
type="submit">

<i class="bi bi-check-circle-fill"></i>

Update Profile

</button>

<a
href="/admin"
class="btn btn-secondary px-5 ms-3">

<i class="bi bi-arrow-left-circle"></i>

Back

</a>

</div>

</form>

</div>

</div>

</div>

</body>

</html>
