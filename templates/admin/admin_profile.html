<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Profile</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

<style>

*{
    box-sizing:border-box;
}

body{
    background:#f4f7fa;
    font-family:"Segoe UI",Arial,sans-serif;
    font-size:12px;
    margin:0;
}

/* PROFILE CARD */

.profile-card{
    max-width:1000px;
    margin:20px auto;
    border:none;
    border-radius:14px;
    overflow:hidden;
    box-shadow:0 8px 22px rgba(0,0,0,.12);
}

/* PROFILE HEADER */

.profile-header{
    background:#198754;
    color:white;
    padding:22px 25px;
}

.profile-img{
    width:115px;
    height:115px;
    border-radius:50%;
    border:4px solid white;
    object-fit:cover;
    background:white;
}

/* HEADER TEXT */

.profile-header h2{
    font-size:21px;
    font-weight:600;
    margin-bottom:6px;
}

.profile-header h5{
    font-size:14px;
    font-weight:500;
    margin-top:8px !important;
    margin-bottom:5px;
}

.profile-header p{
    font-size:10px;
    margin:0;
}

/* FORM BODY */

.profile-card .card-body{
    padding:22px 25px !important;
}

.form-label{
    font-size:11px;
    font-weight:600;
    margin-bottom:5px;
    color:#333;
}

.form-control{
    height:36px;
    padding:6px 10px;
    border-radius:6px;
    font-size:11px;
}

.form-control:focus{
    box-shadow:none;
    border-color:#198754;
}

/* FORM SPACING */

.profile-card .mb-4{
    margin-bottom:13px !important;
}

/* SAVE BUTTON */

.btn-save{
    background:#198754;
    color:white;
    border:none;
    border-radius:7px;
    padding:7px 20px !important;
    font-size:11px;
    font-weight:600;
}

.btn-save:hover{
    background:#157347;
    color:white;
}

/* BACK BUTTON */

.profile-card .btn-secondary{
    padding:7px 20px !important;
    border-radius:7px;
    font-size:11px;
}

/* BUTTON AREA */

.profile-card .text-center{
    margin-top:10px !important;
}

/* MOBILE */

@media(max-width:768px){

    .container{
        margin-top:12px !important;
        margin-bottom:12px !important;
    }

    .profile-card{
        margin:0;
        border-radius:12px;
    }

    .profile-header{
        padding:18px;
    }

    .profile-img{
        width:95px;
        height:95px;
        margin-bottom:10px;
    }

    .profile-header h2{
        font-size:19px;
    }

    .profile-header h5{
        font-size:13px;
    }

    .profile-card .card-body{
        padding:18px !important;
    }

    .btn-save,
    .profile-card .btn-secondary{
        padding:7px 15px !important;
        font-size:10px;
    }

}

</style>

</head>

<body>

<div class="container mt-5 mb-5">

<div class="card profile-card">

<!-- PROFILE HEADER -->

<div class="profile-header">

<div class="row align-items-center">

<div class="col-md-3 text-center">

{% if admin[5] %}

<img
src="{{ url_for('static', filename='uploads/profile/' + admin[5]) }}"
class="profile-img"
alt="Admin Profile">

{% else %}

<img
src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png"
class="profile-img"
alt="Default Admin">

{% endif %}

</div>

<div class="col-md-9">

<h2>

<i class="bi bi-person-circle"></i>

Administrator Profile

</h2>

<h5>

Welcome,

{{ admin[2] if admin[2] else admin[1] }}

</h5>

<p>

Manage your profile information

</p>

</div>

</div>

</div>


<!-- PROFILE FORM -->

<div class="card-body">

<form action="/update_admin_profile" method="POST">

<div class="row">

<!-- FULL NAME -->

<div class="col-md-6 mb-4">

<label class="form-label">

Full Name

</label>

<input
type="text"
name="full_name"
class="form-control"
value="{{ admin[2] if admin[2] else '' }}"
required>

</div>


<!-- USERNAME -->

<div class="col-md-6 mb-4">

<label class="form-label">

Username

</label>

<input
type="text"
class="form-control"
value="{{ admin[1] }}"
readonly>

</div>


<!-- EMAIL -->

<div class="col-md-6 mb-4">

<label class="form-label">

Email

</label>

<input
type="email"
name="email"
class="form-control"
value="{{ admin[3] if admin[3] else '' }}">

</div>


<!-- PHONE -->

<div class="col-md-6 mb-4">

<label class="form-label">

Phone Number

</label>

<input
type="text"
name="phone"
class="form-control"
value="{{ admin[4] if admin[4] else '' }}">

</div>

</div>


<!-- BUTTONS -->

<div class="text-center mt-4">

<button
class="btn btn-save"
type="submit">

<i class="bi bi-check-circle-fill"></i>

Update Profile

</button>

<a
href="/admin"
class="btn btn-secondary ms-2">

<i class="bi bi-arrow-left-circle"></i>

Back

</a>

</div>

</form>

</div>

</div>

</div>

</body>

</html>
