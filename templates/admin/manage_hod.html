<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Manage HOD</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/admin.css') }}">

    <style>

        *{
            box-sizing:border-box;
        }

        body{
            background:#f3f8f4;
            font-family:"Segoe UI",Arial,sans-serif;
            font-size:12px;
            margin:0;
        }

        /* MAIN CONTAINER */

        .manage-hod-container{
            max-width:1000px;
            margin:20px auto !important;
        }

        /* MAIN CARD */

        .manage-hod-card{
            border:none !important;
            border-radius:14px !important;
            overflow:hidden;
            box-shadow:0 8px 22px rgba(0,0,0,.10) !important;
        }

        /* HEADER */

        .manage-hod-card .card-header{
            padding:16px 20px;
            border:none;
        }

        .manage-hod-card .card-header h3{
            margin:0;
            font-size:20px;
            font-weight:600;
        }

        .manage-hod-card .card-header i{
            font-size:18px;
            margin-right:5px;
        }

        /* BODY */

        .manage-hod-card .card-body{
            padding:20px !important;
        }

        /* LABEL */

        .manage-hod-card .form-label{
            font-size:11px;
            font-weight:600;
            margin-bottom:5px;
        }

        /* INPUT */

        .manage-hod-card .form-control{
            height:36px;
            padding:6px 10px;
            font-size:11px;
            border-radius:6px;
        }

        .manage-hod-card .form-control:focus{
            border-color:#198754;
            box-shadow:none;
        }

        /* FORM SPACING */

        .manage-hod-card .mb-3{
            margin-bottom:12px !important;
        }

        /* BUTTONS */

        .manage-hod-card .btn{
            padding:7px 16px;
            font-size:10px;
            font-weight:600;
            border-radius:7px;
        }

        .manage-hod-card .btn-lg{
            padding:7px 18px;
            font-size:10px;
        }

        .manage-hod-card .btn i{
            font-size:11px;
            margin-right:3px;
        }

        /* BUTTON AREA */

        .manage-hod-card .text-center{
            margin-top:8px !important;
        }

        /* DIVIDER */

        .manage-hod-card hr{
            margin:18px 0 !important;
        }

        /* HOD LIST TITLE */

        .hod-list-title{
            font-size:16px;
            font-weight:600;
            color:#198754;
            margin-bottom:10px;
        }

        .hod-list-title i{
            font-size:15px;
            margin-right:4px;
        }

        /* TABLE */

        .manage-hod-card .table{
            margin-bottom:0;
            font-size:10px;
        }

        .manage-hod-card .table th{
            padding:8px 9px;
            font-size:10px;
            font-weight:600;
            white-space:nowrap;
            vertical-align:middle;
        }

        .manage-hod-card .table td{
            padding:7px 9px;
            font-size:10px;
            vertical-align:middle;
            white-space:nowrap;
        }

        .manage-hod-card .table thead{
            vertical-align:middle;
        }

        /* RESPONSIVE */

        @media(max-width:768px){

            .manage-hod-container{
                margin:12px auto !important;
                padding:0 10px;
            }

            .manage-hod-card .card-body{
                padding:15px !important;
            }

            .manage-hod-card .card-header{
                padding:14px 16px;
            }

            .manage-hod-card .card-header h3{
                font-size:18px;
            }

            .manage-hod-card .form-control{
                height:35px;
            }

            .manage-hod-card .btn-lg{
                padding:6px 14px;
                font-size:9px;
            }

            .manage-hod-card .table th,
            .manage-hod-card .table td{
                font-size:9px;
                padding:6px;
            }

        }

    </style>

</head>

<body>

<div class="container manage-hod-container">

    <div class="card manage-hod-card">

        <!-- HEADER -->

        <div class="card-header bg-success text-white">

            <h3>
                <i class="bi bi-person-badge-fill"></i>
                Manage HOD
            </h3>

        </div>


        <!-- BODY -->

        <div class="card-body">

            <!-- ADD HOD FORM -->

            <form action="/add_hod" method="POST">

                <div class="row">

                    <!-- HOD NAME -->

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            HOD Name
                        </label>

                        <input
                            type="text"
                            name="hod_name"
                            class="form-control"
                            required>

                    </div>


                    <!-- DEPARTMENT -->

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Department
                        </label>

                        <input
                            type="text"
                            name="department"
                            class="form-control"
                            required>

                    </div>


                    <!-- EMAIL -->

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Email
                        </label>

                        <input
                            type="email"
                            name="email"
                            class="form-control"
                            required>

                    </div>


                    <!-- PHONE -->

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Phone
                        </label>

                        <input
                            type="text"
                            name="phone"
                            class="form-control"
                            required>

                    </div>


                    <!-- USERNAME -->

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Username
                        </label>

                        <input
                            type="text"
                            name="username"
                            class="form-control"
                            required>

                    </div>


                    <!-- PASSWORD -->

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Password
                        </label>

                        <input
                            type="password"
                            name="password"
                            class="form-control"
                            required>

                    </div>

                </div>


                <!-- BUTTONS -->

                <div class="text-center mt-3">

                    <button
                        type="submit"
                        class="btn btn-success btn-lg">

                        <i class="bi bi-plus-circle-fill"></i>
                        Create HOD

                    </button>


                    <a
                        href="/admin"
                        class="btn btn-secondary btn-lg ms-2">

                        <i class="bi bi-arrow-left-circle-fill"></i>
                        Back

                    </a>

                </div>

            </form>


            <hr class="my-4">


            <!-- HOD LIST -->

            <h4 class="hod-list-title">

                <i class="bi bi-list-ul"></i>
                HOD List

            </h4>


            <div class="table-responsive">

                <table class="table table-bordered table-hover">

                    <thead class="table-success">

                        <tr>

                            <th>ID</th>
                            <th>HOD Name</th>
                            <th>Department</th>
                            <th>Email</th>
                            <th>Phone</th>
                            <th>Username</th>

                        </tr>

                    </thead>


                    <tbody>

                        {% for hod in hods %}

                        <tr>

                            <td>{{ hod[0] }}</td>
                            <td>{{ hod[1] }}</td>
                            <td>{{ hod[2] }}</td>
                            <td>{{ hod[3] }}</td>
                            <td>{{ hod[4] }}</td>
                            <td>{{ hod[5] }}</td>

                        </tr>

                        {% endfor %}

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
