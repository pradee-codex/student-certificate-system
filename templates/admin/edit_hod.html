<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit HOD</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/admin.css') }}">

    <style>
        body {
            background: #f3f8f4;
            font-family: "Segoe UI", Arial, sans-serif;
            font-size: 12px;
            margin: 0;
        }

        .edit-hod-container {
            max-width: 700px;
            margin: 35px auto;
        }

        .edit-hod-card {
            border: none;
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 8px 22px rgba(0,0,0,.10);
        }

        .edit-hod-card .card-header {
            padding: 16px 20px;
        }

        .edit-hod-card .card-header h3 {
            margin: 0;
            font-size: 20px;
            font-weight: 600;
        }

        .edit-hod-card .card-body {
            padding: 25px;
        }

        .form-label {
            font-size: 11px;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .form-control {
            height: 36px;
            padding: 6px 10px;
            font-size: 11px;
            border-radius: 6px;
        }

        .form-control:focus {
            border-color: #198754;
            box-shadow: none;
        }

        .mb-3 {
            margin-bottom: 13px !important;
        }

        .btn {
            padding: 7px 16px;
            font-size: 10px;
            font-weight: 600;
            border-radius: 7px;
        }
    </style>

</head>

<body>

<div class="container edit-hod-container">

    <div class="card edit-hod-card">

        <!-- HEADER -->

        <div class="card-header bg-success text-white">

            <h3>
                <i class="bi bi-pencil-square"></i>
                Edit HOD
            </h3>

        </div>


        <!-- BODY -->

        <div class="card-body">

            <form method="POST"
                  action="{{ url_for('edit_hod', hod_id=hod[0]) }}">

                <div class="row">

                    <!-- HOD NAME -->

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            HOD Name
                        </label>

                        <input
                            type="text"
                            name="hod_name"
                            class="form-control"
                            value="{{ hod[1] }}"
                            required>

                    </div>


                    <!-- DEPARTMENT -->

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Department
                        </label>

                        <input
                            type="text"
                            name="department"
                            class="form-control"
                            value="{{ hod[2] }}"
                            required>

                    </div>


                    <!-- EMAIL -->

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Email
                        </label>

                        <input
                            type="email"
                            name="email"
                            class="form-control"
                            value="{{ hod[3] }}"
                            required>

                    </div>


                    <!-- PHONE -->

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Phone
                        </label>

                        <input
                            type="text"
                            name="phone"
                            class="form-control"
                            value="{{ hod[4] }}"
                            required>

                    </div>


                    <!-- USERNAME -->

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Username
                        </label>

                        <input
                            type="text"
                            name="username"
                            class="form-control"
                            value="{{ hod[5] }}"
                            required>

                    </div>


                    <!-- PASSWORD -->

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            New Password
                        </label>

                        <input
                            type="password"
                            name="password"
                            class="form-control"
                            placeholder="Leave blank to keep old password">

                    </div>

                </div>


                <!-- BUTTONS -->

                <div class="mt-3">

                    <button
                        type="submit"
                        class="btn btn-success">

                        <i class="bi bi-check-circle-fill"></i>
                        Update HOD

                    </button>


                    <a
                        href="{{ url_for('manage_hod') }}"
                        class="btn btn-secondary ms-2">

                        <i class="bi bi-arrow-left-circle-fill"></i>
                        Cancel

                    </a>

                </div>

            </form>

        </div>

    </div>

</div>

</body>

</html>
