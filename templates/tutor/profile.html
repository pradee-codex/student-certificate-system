<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tutor Profile</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet">

<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      rel="stylesheet">

<style>

/* =========================================
   TUTOR PROFILE - COMPACT SIZE
   SAME STYLE AS TUTOR DASHBOARD
========================================= */

body{
    background:#eef2f7;
    font-family:'Poppins',sans-serif;
    font-size:13px;
}


/* PROFILE CARD */

.profile-card{
    max-width:1000px;
    margin:25px auto;
    border:none;
    border-radius:15px;
    overflow:hidden;
    box-shadow:0 8px 25px rgba(0,0,0,.12);
}


/* PROFILE HEADER */

.profile-header{
    background:linear-gradient(135deg,#198754,#0d6efd);
    color:white;
    padding:25px;
}


/* PROFILE IMAGE */

.profile-img{
    width:125px;
    height:125px;
    border-radius:50%;
    border:4px solid #fff;
    object-fit:cover;
    background:#fff;
    box-shadow:0 6px 18px rgba(0,0,0,.20);
}


/* IMAGE UPLOAD */

.upload-btn{
    margin-top:10px;
}

.upload-btn .form-control{
    font-size:11px;
    padding:6px 8px;
}

.upload-btn .btn{
    font-size:11px;
    padding:7px 14px;
    border-radius:7px;
}


/* PROFILE TITLE */

.profile-header h2{
    font-size:22px;
    margin-bottom:8px;
}

.profile-header h4{
    font-size:16px;
    margin-bottom:7px;
}

.profile-header p{
    font-size:11px;
    margin-bottom:0;
}


/* FORM BODY */

.profile-card .card-body{
    padding:25px !important;
}


/* LABEL */

.form-label{
    font-size:11px;
    font-weight:600;
    margin-bottom:5px;
}


/* INPUT */

.form-control{
    font-size:11px;
    padding:8px 10px;
    border-radius:7px;
}


/* SAVE BUTTON */

.btn-save{
    background:#198754;
    color:white;
    padding:8px 22px;
    border-radius:7px;
    font-size:11px;
    border:none;
}

.btn-save:hover{
    background:#157347;
    color:white;
}


/* BACK BUTTON */

.btn-back{
    padding:8px 22px;
    border-radius:7px;
    font-size:11px;
}


/* FORM SPACING */

.profile-card .mb-3{
    margin-bottom:14px !important;
}


/* MOBILE */

@media (max-width:768px){

    .profile-card{
        margin:15px;
    }

    .profile-header{
        padding:20px;
    }

    .profile-img{
        width:105px;
        height:105px;
    }

    .profile-header h2{
        font-size:20px;
    }

    .profile-header h4{
        font-size:14px;
    }

    .profile-header p{
        font-size:10px;
    }

    .profile-card .card-body{
        padding:20px !important;
    }

}

</style>

</head>


<body>


<div class="card profile-card">


    <!-- =====================================================
         PROFILE HEADER
    ====================================================== -->

    <div class="profile-header">

        <div class="row align-items-center">


            <!-- PROFILE PHOTO -->

            <div class="col-md-3 text-center">

                <img
                    id="preview"
                    src="{% if tutor[6] %}{{ url_for('static', filename='uploads/profile/' + tutor[6]) }}{% else %}{{ url_for('static', filename='uploads/profile/default.png') }}{% endif %}"
                    class="profile-img"
                    alt="Tutor Profile">


                <form
                    action="/upload_tutor_photo"
                    method="POST"
                    enctype="multipart/form-data"
                    class="upload-btn">


                    <input
                        type="file"
                        name="profile_photo"
                        class="form-control mt-2"
                        accept=".jpg,.jpeg,.png"
                        onchange="previewImage(event)"
                        required>


                    <button
                        type="submit"
                        class="btn btn-light mt-2">

                        <i class="bi bi-upload"></i>

                        Upload Photo

                    </button>

                </form>

            </div>


            <!-- PROFILE DETAILS -->

            <div class="col-md-9">

                <h2>

                    <i class="bi bi-person-circle"></i>

                    Tutor Profile

                </h2>


                <h4>

                    Welcome,

                    {{ tutor[1] }}

                </h4>


                <p>

                    Department :

                    {{ tutor[2] }}

                </p>

            </div>


        </div>

    </div>



    <!-- =====================================================
         PROFILE FORM
    ====================================================== -->

    <div class="card-body">


        <form
            action="/update_tutor_profile"
            method="POST">


            <div class="row">


                <!-- FULL NAME -->

                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Full Name
                    </label>

                    <input
                        type="text"
                        name="name"
                        class="form-control"
                        value="{{ tutor[1] }}"
                        required>

                </div>


                <!-- DEPARTMENT -->

                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Department
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        value="{{ tutor[2] }}"
                        readonly>

                </div>


                <!-- EMAIL -->

                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Email
                    </label>

                    <input
                        type="email"
                        name="email"
                        class="form-control"
                        value="{{ tutor[3] }}">

                </div>


                <!-- PHONE -->

                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Phone Number
                    </label>

                    <input
                        type="text"
                        name="phone"
                        class="form-control"
                        value="{{ tutor[4] }}">

                </div>


                <!-- USERNAME -->

                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Username
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        value="{{ tutor[5] }}"
                        readonly>

                </div>


                <!-- ROLE -->

                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Role
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        value="Tutor"
                        readonly>

                </div>


            </div>


            <!-- BUTTONS -->

            <div class="text-center mt-3">

                <button
                    type="submit"
                    class="btn btn-save">

                    <i class="bi bi-check-circle-fill"></i>

                    Update Profile

                </button>


                <a
                    href="/tutor"
                    class="btn btn-secondary btn-back ms-2">

                    <i class="bi bi-arrow-left-circle-fill"></i>

                    Back

                </a>

            </div>


        </form>

    </div>


</div>



<!-- =====================================================
     IMAGE PREVIEW SCRIPT
====================================================== -->

<script>

function previewImage(event){

    const file = event.target.files[0];

    if(file){

        const reader = new FileReader();

        reader.onload = function(e){

            document.getElementById("preview").src =
                e.target.result;

        }

        reader.readAsDataURL(file);

    }

}

</script>



<!-- BOOTSTRAP JS -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>


</body>

</html>
