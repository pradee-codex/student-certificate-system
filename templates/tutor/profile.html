<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tutor Profile</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

<style>

body{
    background:#eef2f7;
    font-family:'Poppins',sans-serif;
}

.profile-card{
    max-width:1100px;
    margin:40px auto;
    border:none;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 10px 30px rgba(0,0,0,.15);
}

.profile-header{
    background:linear-gradient(135deg,#198754,#0d6efd);
    color:white;
    padding:35px;
}

.profile-img{
    width:170px;
    height:170px;
    border-radius:50%;
    border:5px solid #fff;
    object-fit:cover;
    background:#fff;
    box-shadow:0 8px 25px rgba(0,0,0,.25);
}

.upload-btn{
    margin-top:15px;
}

.btn-save{
    background:#198754;
    color:white;
    padding:10px 35px;
    border-radius:8px;
}

.btn-back{
    padding:10px 35px;
    border-radius:8px;
}

</style>

</head>

<body>

<div class="card profile-card">

<div class="profile-header">

<div class="row align-items-center">

<div class="col-md-3 text-center">

<img
id="preview"
src="{% if tutor[6] %}{{ url_for('static', filename='uploads/profile/' + tutor[6]) }}{% else %}{{ url_for('static', filename='uploads/profile/default.png') }}{% endif %}"
class="profile-img">

<form
action="/upload_tutor_photo"
method="POST"
enctype="multipart/form-data"
class="upload-btn">

<input
type="file"
name="profile_photo"
class="form-control mt-3"
accept=".jpg,.jpeg,.png"
onchange="previewImage(event)"
required>

<button
type="submit"
class="btn btn-light mt-3">

<i class="bi bi-upload"></i>

Upload Photo

</button>

</form>

</div>

<div class="col-md-9">

<h2>

<i class="bi bi-person-circle"></i>

Tutor Profile

</h2>

<h4>

Welcome,

{{ tutor[1] }}

</h4>

<p>

Department :

{{ tutor[2] }}

</p>

</div>

</div>

</div>

<div class="card-body p-5">

<form action="/update_tutor_profile" method="POST">

<div class="row">

<div class="col-md-6 mb-3">

<label class="form-label">Full Name</label>

<input
type="text"
name="name"
class="form-control"
value="{{ tutor[1] }}"
required>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">Department</label>

<input
type="text"
class="form-control"
value="{{ tutor[2] }}"
readonly>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">Email</label>

<input
type="email"
name="email"
class="form-control"
value="{{ tutor[3] }}">

</div>

<div class="col-md-6 mb-3">

<label class="form-label">Phone Number</label>

<input
type="text"
name="phone"
class="form-control"
value="{{ tutor[4] }}">

</div>

<div class="col-md-6 mb-3">

<label class="form-label">Username</label>

<input
type="text"
class="form-control"
value="{{ tutor[5] }}"
readonly>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">Role</label>

<input
type="text"
class="form-control"
value="Tutor"
readonly>

</div>

</div>

<div class="text-center mt-4">

<button
type="submit"
class="btn btn-save">

<i class="bi bi-check-circle-fill"></i>

Update Profile

</button>

<a
href="/tutor"
class="btn btn-secondary btn-back ms-2">

<i class="bi bi-arrow-left-circle-fill"></i>

Back

</a>

</div>

</form>

</div>

</div>
<!-- ===========================
     Image Preview Script
=========================== -->

<script>

function previewImage(event){

    const file = event.target.files[0];

    if(file){

        const reader = new FileReader();

        reader.onload = function(e){

            document.getElementById("preview").src = e.target.result;

        }

        reader.readAsDataURL(file);

    }

}

</script>

<!-- Bootstrap JS -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
