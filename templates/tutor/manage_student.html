<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Manage Students</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

<link rel="stylesheet"
href="{{ url_for('static', filename='css/tutor.css') }}">

<style>

/* =========================================
   COMPACT MANAGE STUDENTS
   Only size/spacing changed
   Layout kept from tutor.css
   ========================================= */

body {
    font-size: 11px !important;
}

/* TOPBAR */

.topbar {
    padding: 14px 18px !important;
    margin-bottom: 14px !important;
}

.topbar h2 {
    font-size: 21px !important;
    margin: 0 0 3px 0 !important;
}

.topbar h2 i {
    font-size: 19px !important;
}

.topbar small {
    font-size: 10px !important;
}

.profile {
    font-size: 11px !important;
}

.profile i {
    font-size: 24px !important;
}


/* =========================================
   STATISTICS
   ========================================= */

.row.g-4 {
    --bs-gutter-x: 12px !important;
    --bs-gutter-y: 12px !important;
}

.stat-card {
    padding: 15px !important;
    min-height: 115px !important;
    border-radius: 12px !important;
}

.stat-card i {
    font-size: 24px !important;
    margin-bottom: 5px !important;
}

.stat-card h3 {
    font-size: 23px !important;
    margin: 4px 0 !important;
}

.stat-card p {
    font-size: 10px !important;
    margin: 0 !important;
}


/* =========================================
   CARDS
   ========================================= */

.card {
    margin-top: 15px !important;
    border-radius: 12px !important;
}

.card-header {
    padding: 11px 15px !important;
}

.card-header h4 {
    font-size: 15px !important;
    margin: 0 !important;
}

.card-header h4 i {
    font-size: 14px !important;
}

.card-body {
    padding: 15px !important;
}


/* =========================================
   FORM
   ========================================= */

.form-label,
label {
    font-size: 10px !important;
    margin-bottom: 4px !important;
    font-weight: 600;
}

.form-control,
.form-select {
    font-size: 10px !important;
    padding: 7px 9px !important;
    min-height: 33px !important;
    border-radius: 6px !important;
}

.form-control::placeholder {
    font-size: 10px !important;
}


/* Form spacing */

.col-lg-6,
.col-md-6 {
    margin-bottom: 10px !important;
}


/* =========================================
   BUTTONS
   ========================================= */

.btn {
    font-size: 10px !important;
    border-radius: 6px !important;
}

.btn-lg {
    padding: 7px 18px !important;
    font-size: 10px !important;
}

.btn-sm {
    padding: 4px 7px !important;
    font-size: 9px !important;
}

.btn i {
    font-size: 10px !important;
}


/* =========================================
   EXCEL UPLOAD
   ========================================= */

.card-body small {
    font-size: 9px !important;
}

hr {
    margin: 12px 0 !important;
}


/* =========================================
   STUDENT LIST
   ========================================= */

#searchStudent {
    width: 250px !important;
    height: 33px !important;
    padding: 6px 10px !important;
    font-size: 10px !important;
}


/* =========================================
   TABLE
   ========================================= */

#studentTable {
    font-size: 10px !important;
}

#studentTable th {
    font-size: 10px !important;
    padding: 7px 8px !important;
    white-space: nowrap;
}

#studentTable td {
    font-size: 10px !important;
    padding: 7px 8px !important;
    white-space: nowrap;
}

#studentTable .btn-sm {
    padding: 4px 7px !important;
    font-size: 9px !important;
}


/* =========================================
   FOOTER
   ========================================= */

.text-center.mt-4.mb-3 {
    margin-top: 14px !important;
    margin-bottom: 10px !important;
}

.text-center.mt-4.mb-3 small {
    font-size: 9px !important;
}


/* =========================================
   MOBILE
   ========================================= */

@media (max-width: 768px) {

    .topbar h2 {
        font-size: 18px !important;
    }

    #searchStudent {
        width: 180px !important;
    }

}

</style>

</head>


<body>

<div class="wrapper">

    <!-- Sidebar -->

    <aside class="sidebar">

        <div class="logo">

            <i class="bi bi-mortarboard-fill"></i>

            <h3>Tutor Panel</h3>

            <p>Student Certificate System</p>

        </div>


        <ul>

            <li>
                <a href="/tutor">
                    <i class="bi bi-speedometer2"></i>
                    Dashboard
                </a>
            </li>


            <li class="active">
                <a href="/manage_student">
                    <i class="bi bi-person-plus-fill"></i>
                    Manage Students
                </a>
            </li>


            <li>
                <a href="/logout">
                    <i class="bi bi-box-arrow-right"></i>
                    Logout
                </a>
            </li>

        </ul>

    </aside>


    <!-- MAIN CONTENT -->

    <main class="main-content">


        <!-- HEADER -->

        <div class="topbar">

            <div>

                <h2>
                    <i class="bi bi-people-fill"></i>
                    Manage Students
                </h2>

                <small>
                    Create Student Login Accounts
                </small>

            </div>


            <div class="profile">

                <i class="bi bi-person-circle"></i>

                <span>
                    {{ session.username }}
                </span>

            </div>

        </div>


        <!-- STATISTICS -->

        <div class="row g-4 mt-2">


            <div class="col-md-4">

                <div class="stat-card green">

                    <i class="bi bi-people-fill"></i>

                    <h3>
                        {{ students|length }}
                    </h3>

                    <p>
                        Total Students
                    </p>

                </div>

            </div>


            <div class="col-md-4">

                <div class="stat-card blue">

                    <i class="bi bi-award-fill"></i>

                    <h3>
                        {{ department }}
                    </h3>

                    <p>
                        Department
                    </p>

                </div>

            </div>


            <div class="col-md-4">

                <div class="stat-card orange">

                    <i class="bi bi-person-check-fill"></i>

                    <h3>
                        Active
                    </h3>

                    <p>
                        Tutor Account
                    </p>

                </div>

            </div>

        </div>


        <!-- CREATE STUDENT -->

        <div class="card shadow-lg border-0 mt-4">


            <div class="card-header">

                <h4>

                    <i class="bi bi-person-plus-fill"></i>

                    Create Student Account

                </h4>

            </div>


            <div class="card-body">


                <form
                    action="/add_student"
                    method="POST">


                    <div class="row">


                        <!-- STUDENT NAME -->

                        <div class="col-lg-6 mb-4">

                            <label class="form-label">
                                Student Name
                            </label>

                            <input
                                type="text"
                                name="student_name"
                                class="form-control"
                                placeholder="Enter Student Name"
                                required>

                        </div>


                        <!-- REGISTER NUMBER -->

                        <div class="col-lg-6 mb-4">

                            <label class="form-label">
                                Register Number
                            </label>

                            <input
                                type="text"
                                name="register_no"
                                class="form-control"
                                placeholder="Enter Register Number"
                                required>

                        </div>


                        <!-- DEPARTMENT -->

                        <div class="col-lg-6 mb-4">

                            <label class="form-label">
                                Department
                            </label>

                            <input
                                type="text"
                                name="department"
                                class="form-control"
                                value="{{ department }}"
                                readonly>

                        </div>


                        <!-- SECTION -->

                        <div class="col-md-6 mb-3">

                            <label>
                                Section
                            </label>

                            <select
                                name="section"
                                class="form-select"
                                required>

                                <option value="">
                                    Select Section
                                </option>

                                <option value="A">
                                    A
                                </option>

                                <option value="B">
                                    B
                                </option>

                                <option value="C">
                                    C
                                </option>
