<!DOCTYPE html>

<html>

<head>

<title>
Forgot Password
</title>


<link rel="stylesheet"
href="{{ url_for('static', filename='css/student.css') }}">


</head>



<body>


<div class="card"
style="width:400px;margin:100px auto;">



<h2>
Forgot Password
</h2>



<form method="POST"
action="/forgot_password">



<input

type="text"

name="username"

placeholder="Enter Username"

required>



<br><br>



<input

type="password"

name="new_password"

placeholder="New Password"

required>



<br><br>



<input

type="password"

name="confirm_password"

placeholder="Confirm Password"

required>



<br><br>



<button type="submit">

 Save

</button>



</form>



<br>


<a href="/">
Back to Login
</a>



</div>



</body>


</html>
