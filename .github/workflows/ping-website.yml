name: Render Keep Alive

on:
  schedule:
    - cron: "0 */5 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render website
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 30 \
            https://YOUR-APP.onrender.com/)
      
          echo "Render Website HTTP Status: $STATUS"
      
          if [ "$STATUS" -ne 200 ]; then
            echo "Website health check failed!"
            exit 1
          fi
