name: Render Keep Alive

on:
  schedule:
    - cron: "0 */5 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render website
        run: |
          curl -fsS --max-time 30 \
            https://student-certificate-system.onrender.com/ \
            || echo "Ping failed"
